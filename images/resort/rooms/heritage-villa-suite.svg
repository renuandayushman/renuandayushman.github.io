<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#78350F"/>
      <stop offset="100%" stopColor="#451A03"/>
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FEF3C7"/>
      <stop offset="50%" stopColor="#FFFBEB"/>
      <stop offset="100%" stopColor="#FDE68A"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FDF4FF"/>
      <stop offset="100%" stopColor="#F5E8D0"/>
    </linearGradient>
  </defs>

  <!-- Wall & Room Background -->
  <rect width="1000" height="800" fill="url(#wallGrad)"/>

  <!-- Exposed Wooden Beam Ceiling -->
  <rect x="0" y="0" width="1000" height="120" fill="url(#woodGrad)"/>
  <line x1="150" y1="0" x2="150" y2="120" stroke="#92400E" stroke-width="8"/>
  <line x1="300" y1="0" x2="300" y2="120" stroke="#92400E" stroke-width="8"/>
  <line x1="500" y1="0" x2="500" y2="120" stroke="#92400E" stroke-width="8"/>
  <line x1="700" y1="0" x2="700" y2="120" stroke="#92400E" stroke-width="8"/>
  <line x1="850" y1="0" x2="850" y2="120" stroke="#92400E" stroke-width="8"/>

  <!-- Garden Courtyard Window / French Door -->
  <rect x="120" y="160" width="280" height="420" rx="16" fill="#BAE6FD" stroke="#78350F" stroke-width="12"/>
  <line x1="260" y1="160" x2="260" y2="580" stroke="#78350F" stroke-width="8"/>
  <line x1="120" y1="370" x2="400" y2="370" stroke="#78350F" stroke-width="8"/>
  <!-- Green foliage outside window -->
  <circle cx="200" cy="450" r="60" fill="#22C55E" opacity="0.7"/>
  <circle cx="320" cy="420" r="70" fill="#16A34A" opacity="0.75"/>
  <circle cx="260" cy="300" r="50" fill="#15803D" opacity="0.6"/>

  <!-- Heritage Four-Poster Teak Wood Bed Frame -->
  <rect x="460" y="240" width="460" height="420" rx="12" fill="#F8FAFC" stroke="#78350F" stroke-width="14"/>
  <rect x="490" y="360" width="400" height="260" rx="8" fill="url(#bedGrad)"/>
  <!-- Pillows -->
  <rect x="520" y="290" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="710" y="290" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <!-- Gold Kasavu Runner -->
  <rect x="490" y="520" width="400" height="60" fill="#F59E0B" opacity="0.8"/>
  <!-- Bedposts -->
  <rect x="450" y="140" width="20" height="540" fill="#451A03"/>
  <rect x="910" y="140" width="20" height="540" fill="#451A03"/>
  <!-- Traditional Nilavilakku Brass Lamp -->
  <ellipse cx="90" cy="620" rx="30" ry="12" fill="#D97706"/>
  <rect x="85" y="480" width="10" height="140" fill="#F59E0B"/>
  <circle cx="90" cy="460" r="18" fill="#FDE047"/>
  <path d="M90 440 Q85 410 90 395 Q95 410 90 440" fill="#EF4444"/>

  <!-- Terracotta Tile Flooring -->
  <rect x="0" y="650" width="1000" height="150" fill="#B45309" opacity="0.8"/>
  <line x1="0" y1="725" x2="1000" y2="725" stroke="#78350F" stroke-width="2"/>
  <line x1="250" y1="650" x2="250" y2="800" stroke="#78350F" stroke-width="2"/>
  <line x1="500" y1="650" x2="500" y2="800" stroke="#78350F" stroke-width="2"/>
  <line x1="750" y1="650" x2="750" y2="800" stroke="#78350F" stroke-width="2"/>

  <!-- Placeholder Card Overlay -->
  <rect x="140" y="60" width="720" height="130" rx="20" fill="#1E1B4B" fill-opacity="0.8" stroke="#F43F5E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="105" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="2">
    PUNNAMADA HERITAGE VILLAS &amp; ROOMS
  </text>
  <text x="500" y="140" font-family="system-ui, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">
    Actual Room Photograph Slot • Replace with villa-room.jpg (1000 × 800)
  </text>
  <text x="500" y="165" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle">
    Traditional Teak Timber • Open Courtyard Verandas
  </text>
</svg>
