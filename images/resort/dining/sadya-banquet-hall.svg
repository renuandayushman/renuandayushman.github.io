<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="diningWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="100%" stopColor="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#22C55E"/>
      <stop offset="50%" stopColor="#16A34A"/>
      <stop offset="100%" stopColor="#15803D"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#diningWall)"/>

  <!-- High Timber Open Rafters -->
  <rect x="0" y="0" width="1000" height="100" fill="#78350F"/>
  <line x1="200" y1="0" x2="200" y2="100" stroke="#92400E" stroke-width="8"/>
  <line x1="400" y1="0" x2="400" y2="100" stroke="#92400E" stroke-width="8"/>
  <line x1="600" y1="0" x2="600" y2="100" stroke="#92400E" stroke-width="8"/>
  <line x1="800" y1="0" x2="800" y2="100" stroke="#92400E" stroke-width="8"/>

  <!-- Warm Hanging Kerala Woven Cane Lanterns -->
  <line x1="250" y1="100" x2="250" y2="240" stroke="#78350F" stroke-width="3"/>
  <circle cx="250" cy="270" r="35" fill="#F59E0B" opacity="0.9" stroke="#78350F" stroke-width="4"/>
  <circle cx="250" cy="270" r="50" fill="#FDE047" opacity="0.3" filter="blur(8px)"/>

  <line x1="750" y1="100" x2="750" y2="240" stroke="#78350F" stroke-width="3"/>
  <circle cx="750" cy="270" r="35" fill="#F59E0B" opacity="0.9" stroke="#78350F" stroke-width="4"/>
  <circle cx="750" cy="270" r="50" fill="#FDE047" opacity="0.3" filter="blur(8px)"/>

  <!-- Long Feast Dining Table with White Linen -->
  <polygon points="100,420 900,420 950,680 50,680" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  
  <!-- Traditional Green Banana Leaves (Sadya Feast) -->
  <!-- Leaf 1 -->
  <path d="M140 450 Q230 440 320 450 Q330 540 310 610 Q220 620 130 610 Q120 530 140 450 Z" fill="url(#leafGrad)" stroke="#14532D" stroke-width="2"/>
  <line x1="135" y1="530" x2="315" y2="530" stroke="#86EFAC" stroke-width="2"/>
  <!-- Leaf 2 -->
  <path d="M360 450 Q450 440 540 450 Q550 540 530 610 Q440 620 350 610 Q340 530 360 450 Z" fill="url(#leafGrad)" stroke="#14532D" stroke-width="2"/>
  <line x1="355" y1="530" x2="535" y2="530" stroke="#86EFAC" stroke-width="2"/>
  <!-- Leaf 3 -->
  <path d="M580 450 Q670 440 760 450 Q770 540 750 610 Q660 620 570 610 Q560 530 580 450 Z" fill="url(#leafGrad)" stroke="#14532D" stroke-width="2"/>
  <line x1="575" y1="530" x2="755" y2="530" stroke="#86EFAC" stroke-width="2"/>

  <!-- Sadya Delicacies: Rice mound, Parippu, Sambar, Avial, Crispy Pappadam -->
  <circle cx="225" cy="545" r="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="225" cy="545" r="14" fill="#F59E0B" opacity="0.8"/> <!-- Ghee/Parippu -->
  <circle cx="275" cy="570" r="18" fill="#FCD34D"/> <!-- Pappadam -->

  <circle cx="445" cy="545" r="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="445" cy="545" r="14" fill="#F59E0B" opacity="0.8"/>
  <circle cx="495" cy="570" r="18" fill="#FCD34D"/>

  <circle cx="665" cy="545" r="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="665" cy="545" r="14" fill="#F59E0B" opacity="0.8"/>
  <circle cx="715" cy="570" r="18" fill="#FCD34D"/>

  <!-- Terracotta Clay Floor -->
  <rect x="0" y="680" width="1000" height="120" fill="#9A3412"/>

  <!-- Placeholder Badge -->
  <rect x="140" y="50" width="720" height="130" rx="20" fill="#14532D" fill-opacity="0.85" stroke="#4ADE80" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="95" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#86EFAC" text-anchor="middle" letter-spacing="2">
    PUNNAMADA BANQUET &amp; SADYA DINING
  </text>
  <text x="500" y="130" font-family="system-ui, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">
    Actual Dining Photograph Slot • Replace with resort-dining.jpg (1000 × 800)
  </text>
  <text x="500" y="155" font-family="monospace" font-size="12" fill="#FDE047" text-anchor="middle">
    Open-Air Waterfront Dining • Traditional Feast Hall
  </text>
</svg>
