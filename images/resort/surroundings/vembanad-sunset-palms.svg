<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4C1D95"/>
      <stop offset="30%" stopColor="#BE185D"/>
      <stop offset="65%" stopColor="#F97316"/>
      <stop offset="90%" stopColor="#FDE047"/>
      <stop offset="100%" stopColor="#FEF08A"/>
    </linearGradient>
    <linearGradient id="waterSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F97316"/>
      <stop offset="35%" stopColor="#BE185D"/>
      <stop offset="70%" stopColor="#4338CA"/>
      <stop offset="100%" stopColor="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Dramatic Sunset Sky -->
  <rect width="1000" height="480" fill="url(#sunsetGrad)"/>

  <!-- Sun Sphere Setting into Lake -->
  <circle cx="500" cy="460" r="100" fill="#FEF08A" opacity="0.95"/>
  <circle cx="500" cy="460" r="140" fill="#FDE047" opacity="0.3" filter="blur(15px)"/>

  <!-- Vembanad Lake Horizon with Reflections -->
  <rect x="0" y="475" width="1000" height="325" fill="url(#waterSunset)"/>

  <!-- Shimmering Golden Sunset Reflection Pillar on Water -->
  <polygon points="440,475 560,475 660,800 340,800" fill="#FDE047" opacity="0.35"/>
  <line x1="470" y1="490" x2="530" y2="490" stroke="#FEF08A" stroke-width="4"/>
  <line x1="450" y1="520" x2="550" y2="520" stroke="#FEF08A" stroke-width="5"/>
  <line x1="420" y1="560" x2="580" y2="560" stroke="#FEF08A" stroke-width="6"/>
  <line x1="390" y1="620" x2="610" y2="620" stroke="#FEF08A" stroke-width="7"/>
  <line x1="360" y1="700" x2="640" y2="700" stroke="#FEF08A" stroke-width="8"/>

  <!-- Dramatic Silhouette Palms Framing Sunset -->
  <path d="M80 800 Q140 500 180 320" stroke="#0F172A" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M180 320 Q280 260 360 300" stroke="#0F172A" stroke-width="8" fill="none"/>
  <path d="M180 320 Q100 240 20 280" stroke="#0F172A" stroke-width="8" fill="none"/>
  <path d="M180 320 Q220 200 240 160" stroke="#0F172A" stroke-width="8" fill="none"/>
  <path d="M180 320 Q140 210 110 170" stroke="#0F172A" stroke-width="8" fill="none"/>

  <path d="M920 800 Q860 520 800 340" stroke="#0F172A" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M800 340 Q700 280 620 310" stroke="#0F172A" stroke-width="8" fill="none"/>
  <path d="M800 340 Q880 260 960 290" stroke="#0F172A" stroke-width="8" fill="none"/>
  <path d="M800 340 Q770 220 750 180" stroke="#0F172A" stroke-width="8" fill="none"/>

  <!-- Distant Houseboat Silhouette cruising lake -->
  <path d="M680 470 Q710 478 760 478 Q810 478 830 468 Q800 462 760 462 Q710 462 680 470 Z" fill="#0F172A"/>
  <path d="M720 462 Q755 440 790 462" stroke="#0F172A" stroke-width="3" fill="none"/>

  <!-- Placeholder Badge -->
  <rect x="140" y="40" width="720" height="130" rx="20" fill="#3B0764" fill-opacity="0.85" stroke="#F43F5E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="85" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="2">
    VEMBANAD LAKE SUNSET &amp; SURROUNDINGS
  </text>
  <text x="500" y="120" font-family="system-ui, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">
    Actual Scenery Photograph Slot • Replace with lake-sunset.jpg (1000 × 800)
  </text>
  <text x="500" y="145" font-family="monospace" font-size="12" fill="#F472B6" text-anchor="middle">
    Twilight Sparklers &amp; Lakeside Fireworks Setting
  </text>
</svg>
